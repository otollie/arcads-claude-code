<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  @font-face{font-family:'Poppins';src:url('fonts/Poppins-SemiBold.ttf');font-weight:600;}
  @font-face{font-family:'Inter';src:url('fonts/InterVar.ttf');font-weight:100 900;}
  body{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:'Poppins',sans-serif;}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .scrim-t{position:absolute;top:0;left:0;right:0;height:42%;
    background:linear-gradient(180deg,rgba(10,7,32,0.82),rgba(10,7,32,0));z-index:2;}
  .scrim-b{position:absolute;bottom:0;left:0;right:0;height:24%;
    background:linear-gradient(0deg,rgba(10,7,32,0.8),rgba(10,7,32,0));z-index:2;}
  .eyebrow{position:absolute;top:70px;left:76px;z-index:3;font-family:'Inter';font-weight:600;
    font-size:30px;color:rgba(255,255,255,0.82);letter-spacing:0.4px;}
  .head{position:absolute;top:118px;left:76px;right:76px;z-index:3;font-weight:600;
    font-size:82px;line-height:0.98;color:#fff;letter-spacing:-1px;}
  .head .g{color:#A78BFA;}
  .brand{position:absolute;bottom:66px;left:0;right:0;text-align:center;z-index:3;
    font-weight:600;font-size:50px;color:#fff;letter-spacing:-0.5px;}
  .cta{position:absolute;bottom:40px;left:0;right:0;text-align:center;z-index:3;
    font-family:'Inter';font-weight:600;font-size:27px;color:rgba(255,255,255,0.8);}
</style></head>
<body>
  <img class="bg" src="mmg-comp-iphone.png">
  <div class="scrim-t"></div><div class="scrim-b"></div>
  <div class="eyebrow">Your numbers. Everywhere you are.</div>
  <div class="head">Your growth,<br>in your <span class="g">pocket</span>.</div>
  <div class="brand">markmygraph.com</div>
  <div class="cta">Check it anywhere. In seconds.</div>
</body></html>
