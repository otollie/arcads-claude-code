<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="tiktok-base.css">
<style>
  .safe { gap: 40px; }
  .win { margin-top: 20px; width: 100%; }
  .page { padding: 40px 44px; }
  .nav { display: flex; align-items: center; gap: 18px; margin-bottom: 44px; }
  .nav .logo { width: 44px; height: 44px; }
  .nav .item { height: 14px; width: 74px; background: #eceae1; border-radius: 6px; }
  .nav .cta { margin-left: auto; height: 40px; width: 120px; background: var(--ink); border-radius: 999px; }
  .hero { font-family: var(--font-display); font-weight: 600; font-size: 54px; line-height: 1.1;
    color: var(--ink); margin-bottom: 18px; }
  .hero em { color: var(--accent); font-style: normal; }
  .sub { height: 16px; width: 68%; background: #eceae1; border-radius: 6px; margin-bottom: 34px; }
  .btnrow { display: flex; gap: 16px; margin-bottom: 44px; }
  .btn { height: 62px; width: 200px; border-radius: 14px; background: var(--accent); }
  .btn.ghost { background: #fff; border: 2.5px solid #dcd9cd; }
  .cards { display: flex; gap: 18px; }
  .c { flex: 1; height: 150px; background: #f4f2ea; border-radius: 14px; }
</style></head>
<body>
  <div class="handle">@orod215</div>
  <div class="counter">3/6</div>
  <div class="safe">
    <div class="tag">what it's actually for</div>
    <div class="h">it designs<br><span class="a">real websites</span></div>
    <div class="sup">describe a landing page. it designs <b>the actual thing</b>, not a picture of one.</div>
    <div class="win">
      <div class="bar"><i></i><i></i><i></i><span class="addr">yoursite.com</span></div>
      <div class="page">
        <div class="nav"><img class="logo" src="brand/claude/starburst.png"><span class="item"></span><span class="item"></span><span class="item"></span><span class="cta"></span></div>
        <div class="hero">launch your idea<br><em>this weekend</em></div>
        <div class="sub"></div>
        <div class="btnrow"><span class="btn"></span><span class="btn ghost"></span></div>
        <div class="cards"><span class="c"></span><span class="c"></span><span class="c"></span></div>
      </div>
    </div>
  </div>
  <div class="wm">@orod215</div>
</body></html>
