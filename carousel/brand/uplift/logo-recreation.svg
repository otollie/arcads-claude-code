<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <!-- RECREATION of the Uplift Marketing wordmark (typeset approximation,
       NOT the official logo file). Swap for the real asset when available. -->
