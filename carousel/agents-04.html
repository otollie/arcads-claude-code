<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="agents-base.css">
<style>
  .kicker { position: absolute; top: 110px; left: 76px; }
  .h { position: absolute; top: 170px; left: 72px; right: 64px; font-size: 80px; }
  .sub { position: absolute; top: 322px; left: 76px; right: 120px; font-size: 31px; font-weight: 500; color: var(--muted); line-height: 1.4; }
  .sub b { color: var(--paper); font-weight: 700; }

  .loop { position: absolute; top: 430px; left: 0; right: 0; height: 560px; }
  .ring { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 470px; height: 470px; }

  .step {
    position: absolute; width: 200px; padding: 22px 20px; border-radius: 20px;
    background: var(--card); border: 1.6px solid var(--line); backdrop-filter: blur(4px);
    text-align: center;
  }
  .step .ic { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: linear-gradient(140deg, var(--violet), var(--magenta)); }
  .step h4 { font-family: 'Archivo Black'; font-size: 28px; letter-spacing: -0.01em; color: var(--paper); }
  .step p { font-size: 21px; color: var(--muted); margin-top: 4px; line-height: 1.25; }

  .s1 { top: -36px; left: 50%; transform: translateX(-50%); }
  .s2 { top: 200px; right: -40px; }
  .s3 { bottom: -36px; left: 50%; transform: translateX(-50%); }
  .s4 { top: 200px; left: -40px; }

  .center {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 150px; height: 150px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.18), rgba(139,92,246,0.1));
    border: 2px solid rgba(233,53,193,0.4);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  .center span { font-family: 'Archivo Black'; font-size: 24px; color: #fff; line-height: 1; }
  .center small { font-size: 18px; color: var(--muted); margin-top: 6px; }

  .foot { position: absolute; bottom: 92px; left: 64px; right: 64px; text-align: center; font-size: 29px; font-weight: 600; color: var(--muted); line-height: 1.4; }
  .foot b { color: var(--paper); }
</style></head>
<body>
  <div class="topbar"><div class="handle">@ollierdz</div><div class="counter">4/7</div></div>

  <div class="kicker">How it works</div>
  <div class="h">The <span class="g">agent loop.</span></div>
  <div class="sub">It doesn't answer once — it <b>loops</b> until the goal is met:</div>

  <div class="loop">
    <div class="ring">
      <!-- circular arrows -->
      <svg viewBox="0 0 470 470" style="position:absolute;inset:0;width:100%;height:100%">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#E935C1"/>
          </linearGradient>
          <marker id="ah" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
            <path d="M1 1 L8 4.5 L1 8 Z" fill="#E935C1"/>
          </marker>
        </defs>
        <g fill="none" stroke="url(#lg)" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)">
          <path d="M300 78 A165 165 0 0 1 392 235"/>
          <path d="M392 235 A165 165 0 0 1 300 392"/>
          <path d="M170 392 A165 165 0 0 1 78 235"/>
          <path d="M78 235 A165 165 0 0 1 170 78"/>
        </g>
      </svg>

      <div class="center"><span>Repeat</span><small>until done</small></div>

      <div class="step s1">
        <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg></div>
        <h4>Goal</h4><p>You say what you want</p>
      </div>
      <div class="step s2">
        <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.7 17h4.6M12 3a5 5 0 0 1 3 9c-.6.5-1 1.2-1 2H10c0-.8-.4-1.5-1-2a5 5 0 0 1 3-9z"/></svg></div>
        <h4>Think</h4><p>Claude plans a step</p>
      </div>
      <div class="step s3">
        <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6a1.5 1.5 0 0 0 2 2l6-6a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg></div>
        <h4>Act</h4><p>It uses a tool</p>
      </div>
      <div class="step s4">
        <div class="ic"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></div>
        <h4>Check</h4><p>Reads the result</p>
      </div>
    </div>
  </div>

  <div class="foot">Think → act → check, over and over — <b>that's the magic.</b></div>

  <div class="wm">@ollierdz</div>
</body></html>
