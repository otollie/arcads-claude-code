<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="agents-base.css">
<style>
  .kicker { position: absolute; top: 150px; left: 76px; }
  .h { position: absolute; top: 232px; left: 72px; right: 64px; font-size: 96px; }

  .sub {
    position: absolute; top: 660px; left: 76px; right: 120px;
    font-size: 34px; font-weight: 500; color: var(--muted); line-height: 1.42;
  }
  .sub b { color: var(--paper); font-weight: 700; }

  /* central robot/agent glyph */
  .stage {
    position: absolute; top: 770px; left: 0; right: 0;
    display: flex; justify-content: center; z-index: 2;
  }
  .orbit { position: relative; width: 460px; height: 360px; }
  .core {
    position: absolute; left: 50%; top: 52%; transform: translate(-50%,-50%);
    width: 188px; height: 188px; border-radius: 30px;
    background: linear-gradient(150deg, var(--violet), var(--magenta));
    box-shadow: 0 30px 70px rgba(139,92,246,0.45), inset 0 2px 10px rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center;
  }
  .node {
    position: absolute; width: 92px; height: 92px; border-radius: 20px;
    background: var(--card); border: 1.6px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .n1 { left: 0; top: 8px; }
  .n2 { right: 0; top: 8px; }
  .n3 { left: 50%; bottom: 0; transform: translateX(-50%); }

  .swipe {
    position: absolute; bottom: 110px; right: 70px; z-index: 6;
    display: flex; align-items: center; gap: 14px;
    font-family: 'Archivo Black'; font-size: 28px; color: var(--paper);
  }
  .swipe svg { width: 56px; height: 32px; }
</style></head>
<body>
  <div class="topbar"><div class="handle">@ollierdz</div><div class="counter">1/7</div></div>

  <div class="kicker">Explainer</div>
  <div class="h">AI <span class="g">agents</span> on Claude, explained.</div>

  <div class="sub">No jargon. What an agent actually is, what it can do, and <b>how to start one</b> 👇</div>

  <div class="stage">
    <div class="orbit">
      <!-- connecting lines -->
      <svg viewBox="0 0 460 360" style="position:absolute;inset:0;width:100%;height:100%">
        <g stroke="rgba(168,164,217,0.35)" stroke-width="2.5" fill="none" stroke-dasharray="5 7">
          <path d="M92 70 L210 188"/><path d="M368 70 L250 188"/><path d="M230 280 L230 230"/>
        </g>
      </svg>
      <div class="node n1"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C9C2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
      <div class="node n2"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C9C2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></div>
      <div class="node n3"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#C9C2FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></div>
      <div class="core">
        <svg width="92" height="92" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 7V4M9 2.5h6"/><circle cx="9.5" cy="12.5" r="1.3" fill="#fff" stroke="none"/><circle cx="14.5" cy="12.5" r="1.3" fill="#fff" stroke="none"/><path d="M2.5 11v3M21.5 11v3"/>
        </svg>
      </div>
    </div>
  </div>

  <div class="swipe">SWIPE
    <svg viewBox="0 0 60 34"><path d="M2 17 H46 M34 5 L48 17 L34 29" stroke="#E935C1" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>

  <div class="wm">@ollierdz</div>
</body></html>
