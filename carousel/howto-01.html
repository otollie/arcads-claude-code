<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .headline { top: 156px; font-size: 100px; }
  .sub {
    position: absolute; top: 612px; left: 76px;
    font-size: 35px; font-weight: 550; color: #333;
    max-width: 580px; line-height: 1.3;
  }
  .sub b { font-weight: 800; color: var(--ink); }

  /* terminal window */
  .term {
    position: absolute; bottom: 70px; left: 70px; right: 70px;
    background: #1b1b1d; border-radius: 18px;
    box-shadow: 0 30px 70px rgba(17,17,17,0.30);
    overflow: hidden;
  }
  .term .bar {
    height: 52px; background: #2b2b2e; display: flex; align-items: center; padding: 0 22px; gap: 11px;
  }
  .dot { width: 15px; height: 15px; border-radius: 50%; }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .term .title { color: #888; font-size: 20px; margin-left: 18px; font-weight: 600;}
  .term .body { padding: 30px 34px 38px; font-family: 'DejaVu Sans Mono', monospace; font-size: 27px; line-height: 1.7; }
  .term .body .prompt { color: var(--terra); }
  .term .body .cmd { color: #f2f2f2; }
  .term .body .out { color: #7fd17f; }
  .term .body .dim { color: #777; }

  .save {
    position: absolute; bottom: 44px; right: 44px; z-index: 9;
    background: var(--terra); color: #fff; border-radius: 14px;
    padding: 20px 30px 20px 26px;
    display: flex; align-items: center; gap: 16px;
    box-shadow: 0 18px 40px rgba(222,139,102,0.45);
  }
  .save .txt { font-family: 'Archivo Black'; font-size: 30px; line-height: 0.95; }
  .save svg { width: 34px; height: 34px; }
</style></head>
<body>
  <div class="topbar"><div class="handle">@ollierdz</div><div class="counter">1/6</div></div>

  <div class="kicker terra">TUTORIAL</div>
  <div class="headline" style="top:222px; font-size:96px;">Install <span class="accent">Claude Code</span> in 5 minutes.</div>

  <div class="sub">
    The AI agent that <b>writes, fixes & ships code</b> from your terminal. Here's the exact setup&nbsp;👇
  </div>

  <div class="term">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">— claude code —</span></div>
    <div class="body">
      <div><span class="prompt">$</span> <span class="cmd">npm install -g @anthropic-ai/claude-code</span></div>
      <div><span class="prompt">$</span> <span class="cmd">claude</span></div>
      <div><span class="out">✔ Welcome to Claude Code</span> <span class="dim">— let's build.</span></div>
    </div>
  </div>

  <div class="wm">@ollierdz</div>

  <div class="save">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M6 2h12a1 1 0 0 1 1 1v19l-7-4.5L5 22V3a1 1 0 0 1 1-1z"/></svg>
    <div class="txt">SAVE<br>POST!</div>
  </div>
</body></html>
