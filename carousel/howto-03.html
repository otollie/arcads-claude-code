<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .stepnum {
    position: absolute; top: 130px; left: 76px;
    font-family: 'Archivo Black'; font-size: 150px; color: var(--terra);
    letter-spacing: -0.04em; line-height: 0.85;
  }
  .steplabel {
    position: absolute; top: 200px; left: 320px;
    font-family: 'Archivo Black'; font-size: 56px; letter-spacing: -0.02em; line-height: 1.0;
  }
  .term {
    position: absolute; top: 470px; left: 70px; right: 70px;
    background: #1b1b1d; border-radius: 18px;
    box-shadow: 0 30px 70px rgba(17,17,17,0.30); overflow: hidden;
  }
  .term .bar { height: 52px; background: #2b2b2e; display: flex; align-items: center; padding: 0 22px; gap: 11px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .term .title { color: #888; font-size: 20px; margin-left: 18px; font-weight: 600; }
  .term .body { padding: 38px 34px; font-family: 'DejaVu Sans Mono', monospace; font-size: 30px; line-height: 1.6; word-break: break-all; }
  .term .body .prompt { color: var(--terra); }
  .term .body .cmd { color: #f2f2f2; }
  .explain {
    position: absolute; top: 800px; left: 76px; right: 90px;
    font-size: 32px; font-weight: 550; color: #333; line-height: 1.4;
  }
  .explain b { font-weight: 800; color: var(--ink); }
  .tip {
    position: absolute; bottom: 120px; left: 76px; right: 76px;
    background: var(--ink); color: #fff; border-radius: 14px;
    padding: 26px 32px; font-size: 25px; line-height: 1.4; font-weight: 500;
  }
  .tip b { color: var(--terra); }
</style></head>
<body>
  <div class="topbar"><div class="handle">@ollierdz</div><div class="counter">4/7</div></div>

  <div class="stepnum">1</div>
  <div class="steplabel">Install it.</div>

  <div class="term">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">— terminal —</span></div>
    <div class="body">
      <span class="prompt">$</span> <span class="cmd">npm install -g&nbsp;@anthropic-ai/claude-code</span>
    </div>
  </div>

  <div class="explain">
    👆 <b>Copy that whole line.</b> Open your Terminal, <b>paste it in</b>, and press <b>Enter</b>. That downloads Claude Code onto your computer.
  </div>

  <div class="tip">💡 <b>No npm yet?</b> Install Node.js first at nodejs.org — npm comes with it.</div>

  <div class="wm">@ollierdz</div>
</body></html>
