<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Boldonse'; src: url('canvas-fonts/Boldonse-Regular.ttf'); }
  @font-face { font-family: 'BigShoulders'; src: url('canvas-fonts/BigShoulders-Bold.ttf'); }
  @font-face { font-family: 'PlexMono'; src: url('canvas-fonts/IBMPlexMono-Regular.ttf'); }
  @font-face { font-family: 'Instrument'; src: url('canvas-fonts/InstrumentSerif-Italic.ttf'); }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --paper: #14102E; --bone: #ECE6D6; --bone-dim: rgba(236,230,214,0.42); --line: rgba(236,230,214,0.16); --sig: #E5484D; }
  body { width: 1080px; height: 1350px; background: var(--paper); color: var(--bone); position: relative; overflow: hidden; }

  /* faint full-bleed coordinate field */
  .field { position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 90px 90px; opacity: 0.5;
    -webkit-mask-image: radial-gradient(720px 720px at 50% 46%, #000 30%, transparent 80%);
            mask-image: radial-gradient(720px 720px at 50% 46%, #000 30%, transparent 80%);
  }

  /* clinical frame marks */
  .frame { position: absolute; inset: 56px; border: 1px solid var(--line); }
  .corner { position: absolute; width: 22px; height: 22px; border: 2px solid var(--bone-dim); }
  .tl{ top:46px; left:46px; border-right:none; border-bottom:none;} .tr{ top:46px; right:46px; border-left:none; border-bottom:none;}
  .bl{ bottom:46px; left:46px; border-right:none; border-top:none;} .br{ bottom:46px; right:46px; border-left:none; border-top:none;}

  .mono { font-family: 'PlexMono', monospace; letter-spacing: 0.04em; }
  .tag { position: absolute; font-size: 19px; color: var(--bone-dim); text-transform: uppercase; }
  .t-fig { top: 84px; left: 84px; }
  .t-cat { top: 84px; right: 84px; text-align: right; }
  .t-axis-l { top: 50%; left: 70px; transform: rotate(-90deg) translateX(50%); transform-origin: left; }
  .t-axis-r { bottom: 360px; right: 84px; text-align: right; }

  /* the instrument: orbital loop diagram */
  .plate { position: absolute; top: 300px; left: 50%; transform: translateX(-50%); width: 560px; height: 560px; }
  .node { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--bone); transform: translate(-50%,-50%); }
  .node.sig { background: var(--sig); box-shadow: 0 0 0 6px rgba(229,72,77,0.18); }
  .nlabel { position: absolute; font-family:'PlexMono',monospace; font-size: 17px; color: var(--bone-dim); transform: translate(-50%,-50%); white-space: nowrap; }

  .word { position: absolute; left: 0; right: 0; top: 532px; text-align: center; font-family: 'Boldonse', sans-serif; font-size: 96px; letter-spacing: -0.01em; color: var(--bone); z-index: 3; }
  .cap { position: absolute; left: 0; right: 0; bottom: 188px; text-align: center; font-family: 'Instrument', serif; font-size: 33px; color: var(--bone-dim); font-style: italic; }
  .foot { position: absolute; bottom: 92px; left: 0; right: 0; text-align: center; font-family:'PlexMono',monospace; font-size: 18px; color: var(--bone-dim); letter-spacing: 0.18em; text-transform: uppercase; }
</style></head>
<body>
  <div class="field"></div>
  <div class="frame"></div>
  <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

  <div class="tag mono t-fig">Fig. 01 — autonomous cycle</div>
  <div class="tag mono t-cat">Plate A / 09<br>cohort: claude</div>
  <div class="tag mono t-axis-l">observe ↔ act</div>
  <div class="tag mono t-axis-r">r = goal<br>θ = step</div>

  <div class="plate">
    <svg viewBox="0 0 560 560" style="position:absolute;inset:0;width:100%;height:100%">
      <g fill="none" stroke="rgba(236,230,214,0.30)" stroke-width="1.4">
        <circle cx="280" cy="280" r="250"/><circle cx="280" cy="280" r="186"/><circle cx="280" cy="280" r="120"/>
      </g>
      <g stroke="rgba(236,230,214,0.16)" stroke-width="1">
        <line x1="280" y1="20" x2="280" y2="540"/><line x1="20" y1="280" x2="540" y2="280"/>
      </g>
      <!-- traced closed orbit (the loop) -->
      <circle cx="280" cy="280" r="186" fill="none" stroke="#E5484D" stroke-width="2.4" stroke-dasharray="3 9" opacity="0.9"/>
      <!-- directional vector -->
      <path d="M280 94 A186 186 0 0 1 449 211" fill="none" stroke="#E5484D" stroke-width="3" marker-end="url(#a)"/>
      <defs><marker id="a" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9 Z" fill="#E5484D"/></marker></defs>
    </svg>
    <!-- 4 plotted nodes on the loop: Goal / Think / Act / Check -->
    <div class="node" style="left:50%; top:16.4%"></div>
    <div class="nlabel" style="left:50%; top:8%">GOAL</div>
    <div class="node sig" style="left:83.6%; top:50%"></div>
    <div class="nlabel" style="left:92%; top:50%">THINK</div>
    <div class="node" style="left:50%; top:83.6%"></div>
    <div class="nlabel" style="left:50%; top:92%">ACT</div>
    <div class="node" style="left:16.4%; top:50%"></div>
    <div class="nlabel" style="left:8%; top:50%">CHECK</div>
    <div class="node" style="left:50%; top:50%; width:9px; height:9px; background:var(--bone-dim)"></div>
  </div>

  <div class="word">AGENT</div>
  <div class="cap">a system observed mid-cycle</div>
  <div class="foot">@ollierdz · what an ai agent really is</div>
</body></html>
