<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  @font-face { font-family:'Anton'; src:url('fonts/Anton-Regular.ttf'); }
  body { width:2560px; height:1440px; position:relative; overflow:hidden;
    font-family:'Anton',Arial,sans-serif;
    background:radial-gradient(circle at 50% 46%, #1c1242 0%, #0A0720 58%); }

  /* faint concentric rings for depth */
  .rings { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1; }
  .rings i { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(139,92,246,0.10); }
  .rings i:nth-child(1){ width:1200px; height:1200px; }
  .rings i:nth-child(2){ width:1720px; height:1720px; border-color:rgba(139,92,246,0.07); }
  .rings i:nth-child(3){ width:2240px; height:2240px; border-color:rgba(139,92,246,0.05); }

  /* everything centered inside the all-devices safe band (1546x423) */
  .safe { position:absolute; left:507px; top:508px; width:1546px; height:423px; z-index:5;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; }
  .title { display:flex; align-items:center; gap:34px; text-transform:uppercase;
    color:#fff; letter-spacing:1px; line-height:1; }
  .title .word { font-size:172px; text-shadow:0 6px 26px rgba(0,0,0,0.5); }
  .box { font-size:180px; color:#fff; line-height:1; padding:6px 40px 24px; border-radius:26px;
    background:linear-gradient(135deg,#8B5CF6 0%, #E935C1 100%);
    box-shadow:0 16px 50px rgba(233,53,193,0.5), inset 0 4px 0 rgba(255,255,255,0.16); }
  .tag { margin-top:44px; text-transform:uppercase; letter-spacing:3px;
    font-size:52px; color:#fff; text-shadow:0 4px 18px rgba(0,0,0,0.55); }
  .tag b { color:#C9B6FF; }
  .foot { margin-top:26px; display:flex; align-items:center; gap:16px;
    text-transform:uppercase; letter-spacing:4px; font-size:32px; color:#c8bff0; }
  .dots { display:flex; gap:9px; }
  .dots i { width:16px; height:16px; border-radius:50%; display:block; }
  .dots i:nth-child(1){ background:#8B5CF6; }
  .dots i:nth-child(2){ background:#E935C1; }
  .dots i:nth-child(3){ background:#5BC8F5; }
</style></head>
<body>
  <div class="rings"><i></i><i></i><i></i></div>
  <div class="safe">
    <div class="title"><span class="word">Today in</span><span class="box">AI</span></div>
    <div class="tag">The latest <b>marketing</b> &amp; <b>AI</b> news</div>
    <div class="foot"><span class="dots"><i></i><i></i><i></i></span> With Ollie Rodriguez</div>
  </div>
</body></html>
