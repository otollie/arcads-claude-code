<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  @font-face{font-family:'Poppins';src:url('fonts/Poppins-SemiBold.ttf');font-weight:600;}
  @font-face{font-family:'Poppins';src:url('fonts/Poppins-Medium.ttf');font-weight:500;}
  @font-face{font-family:'Inter';src:url('fonts/InterVar.ttf');font-weight:100 900;}
  body{width:1080px;height:1080px;overflow:hidden;position:relative;
    font-family:'Poppins',Arial,sans-serif;
    background:radial-gradient(120% 120% at 30% 0%, #6D5DF6 0%, #4F46E5 38%, #3A2F9E 78%, #241a63 100%);}
  .glow{position:absolute;inset:0;background:radial-gradient(closest-side at 78% 22%, rgba(255,255,255,0.22), transparent 60%);}
  .eyebrow{position:absolute;top:96px;left:0;right:0;text-align:center;z-index:3;
    font-family:'Inter';font-weight:600;font-size:32px;color:rgba(255,255,255,0.8);letter-spacing:0.3px;}
  .head{position:absolute;top:150px;left:0;right:0;text-align:center;z-index:3;
    font-weight:600;font-size:96px;line-height:0.98;color:#fff;letter-spacing:-1px;}
  .laptop{position:absolute;left:50%;top:560px;transform:translate(-50%,-50%);z-index:2;width:820px;}
  .screen{background:#14142B;border-radius:26px;padding:18px;box-shadow:0 40px 90px rgba(20,10,60,0.55);}
  .screen img{width:100%;display:block;border-radius:12px;}
  .base{width:940px;height:34px;margin:-2px auto 0;position:relative;left:-60px;
    background:linear-gradient(180deg,#d7d7e6,#a9a9c4);border-radius:0 0 22px 22px;
    box-shadow:0 30px 50px rgba(20,10,60,0.4);}
  .base::after{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:150px;height:12px;background:rgba(20,10,60,0.18);border-radius:0 0 12px 12px;}
  .brand{position:absolute;bottom:112px;left:0;right:0;text-align:center;z-index:3;
    font-weight:600;font-size:52px;color:#fff;letter-spacing:-0.5px;}
  .cta{position:absolute;bottom:66px;left:0;right:0;text-align:center;z-index:3;
    font-family:'Inter';font-weight:600;font-size:30px;color:rgba(255,255,255,0.82);}
</style></head>
<body>
  <div class="glow"></div>
  <div class="eyebrow">Stop guessing if it's working.</div>
  <div class="head">See it climb.</div>
  <div class="laptop">
    <div class="screen"><img src="mmg-graph.png"></div>
    <div class="base"></div>
  </div>
  <div class="brand">markmygraph.com</div>
  <div class="cta">One number a week. That's it.</div>
</body></html>
