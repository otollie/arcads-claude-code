<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="square-base.css">
<style>
  :root { --bg: #0D1F4E; --ink: #FFFFFF; --muted: #b9c6e2; --soft: #16295e; }
  .kick { background: rgba(41,168,219,0.14); color: #29A8DB; }
  .pad { gap: 40px; align-items: flex-start; }
  .loop { display: flex; align-items: center; gap: 26px; margin-top: 26px; }
  .step { background: #16295e; border: 2px solid rgba(41,168,219,0.45); border-radius: 20px;
    padding: 30px 36px; font-family: var(--font-display); font-weight: 600; font-size: 32px; color: #fff; }
  .arr { font-family: var(--font-display); font-weight: 700; font-size: 42px; color: var(--accent); }
  .note { font-size: 26px; color: var(--muted); margin-top: 8px; }
</style></head>
<body>
  <div class="counter" style="color:#fff">4/7</div>
  <div class="pad">
    <div class="kick">the shift</div>
    <div class="h">Reviews aren't luck.<br>They're a <span class="g">process</span>.</div>
    <div class="sup">A five-minute weekly routine your team runs without ever feeling pushy.</div>
    <div>
      <div class="loop">
        <div class="step">ask</div><div class="arr">→</div>
        <div class="step">tap</div><div class="arr">→</div>
        <div class="step">post</div><div class="arr">↻</div>
      </div>
      <div class="note">every week. same 3 beats.</div>
    </div>
  </div>
  <div class="swipe">→</div>
  <div style="position:absolute;bottom:64px;left:90px;z-index:9;font-family:var(--font-display);font-weight:600;font-size:26px;color:#29A8DB;opacity:0.9">uplift.marketing</div>
</body></html>
