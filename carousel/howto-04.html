<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
  .stepnum { position: absolute; top: 130px; left: 76px; font-family: 'Archivo Black'; font-size: 150px; color: var(--terra); letter-spacing: -0.04em; line-height: 0.85; }
  .steplabel { position: absolute; top: 200px; left: 320px; font-family: 'Archivo Black'; font-size: 56px; letter-spacing: -0.02em; line-height: 1.0; }
  .term { position: absolute; top: 470px; left: 70px; right: 70px; background: #1b1b1d; border-radius: 18px; box-shadow: 0 30px 70px rgba(17,17,17,0.30); overflow: hidden; }
  .term .bar { height: 52px; background: #2b2b2e; display: flex; align-items: center; padding: 0 22px; gap: 11px; }
  .dot { width: 15px; height: 15px; border-radius: 50%; }
  .r { background: #ff5f57; } .y { background: #febc2e; } .g { background: #28c840; }
  .term .title { color: #888; font-size: 20px; margin-left: 18px; font-weight: 600; }
  .term .body { padding: 34px; font-family: 'DejaVu Sans Mono', monospace; font-size: 28px; line-height: 1.65; }
  .term .body .prompt { color: var(--terra); }
  .term .body .cmd { color: #f2f2f2; }
  .term .body .out { color: #7fd17f; }
  .term .body .dim { color: #777; }
  .explain { position: absolute; top: 810px; left: 76px; right: 90px; font-size: 32px; font-weight: 550; color: #333; line-height: 1.4; }
  .explain b { font-weight: 800; color: var(--ink); }
  .tip { position: absolute; bottom: 120px; left: 76px; right: 76px; background: var(--ink); color: #fff; border-radius: 14px; padding: 26px 32px; font-size: 25px; line-height: 1.4; font-weight: 500; }
  .tip b { color: var(--terra); }
</style></head>
<body>
  <div class="topbar"><div class="handle">@ollierdz</div><div class="counter">4/6</div></div>

  <div class="stepnum">2</div>
  <div class="steplabel">Log in.</div>

  <div class="term">
    <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="title">— terminal —</span></div>
    <div class="body">
      <div><span class="prompt">$</span> <span class="cmd">claude</span></div>
      <div><span class="dim">→ opening browser to sign in…</span></div>
      <div><span class="out">✔ Logged in as you@email.com</span></div>
    </div>
  </div>

  <div class="explain">
    Type <b>claude</b> and press Enter. It opens your browser — sign in with your Claude account and you're connected.
  </div>

  <div class="tip">💡 <b>One time only.</b> After this it remembers you on every launch.</div>

  <div class="wm">@ollierdz</div>
</body></html>
