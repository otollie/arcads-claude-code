<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  @font-face { font-family:'Anton'; src:url('fonts/Anton-Regular.ttf'); }
  body { width:2048px; height:1152px; position:relative; overflow:hidden;
    background:#0A0720; font-family:'Anton',Arial,sans-serif; }

  /* photo on the right, face kept inside the safe band */
  .photo-wrap { position:absolute; top:0; right:0; width:1180px; height:1152px; z-index:1; }
  .photo { width:100%; height:100%; object-fit:cover; object-position:52% 38%; }
  .fade { position:absolute; inset:0; z-index:2;
    background:linear-gradient(90deg, #0A0720 0%, rgba(10,7,32,0.72) 26%, rgba(10,7,32,0) 60%); }
  .fade2 { position:absolute; inset:0; z-index:2;
    background:linear-gradient(0deg, rgba(10,7,32,0.55) 0%, rgba(10,7,32,0) 28%); }

  /* soft brand glow behind the title */
  .glow { position:absolute; left:180px; top:300px; width:720px; height:560px; z-index:1;
    background:radial-gradient(closest-side, rgba(139,92,246,0.34), rgba(139,92,246,0) 70%); }

  /* text lives inside YouTube's always-visible safe band (center 1546x423) */
  .safe { position:absolute; left:0; right:0; top:365px; height:423px; z-index:5;
    display:flex; align-items:center; }
  .stack { margin-left:300px; }
  .title { text-transform:uppercase; line-height:0.9; color:#fff; letter-spacing:1px; }
  .l1 { font-size:118px; text-shadow:0 6px 26px rgba(0,0,0,0.55); }
  .l2 { margin-top:8px; }
  .box { display:inline-block; font-size:140px; color:#fff; line-height:1;
    padding:2px 34px 16px; border-radius:20px;
    background:linear-gradient(135deg,#8B5CF6 0%, #E935C1 100%);
    box-shadow:0 12px 40px rgba(233,53,193,0.5); }
  .tag { margin-top:34px; text-transform:uppercase; letter-spacing:2px;
    font-size:46px; color:#fff; text-shadow:0 4px 18px rgba(0,0,0,0.6); }
  .tag b { color:#C9B6FF; }
  .foot { margin-top:26px; display:flex; align-items:center; gap:16px;
    text-transform:uppercase; letter-spacing:3px; font-size:30px; color:#e9e4ff; }
  .dots { display:flex; gap:9px; }
  .dots i { width:16px; height:16px; border-radius:50%; display:block; }
  .dots i:nth-child(1){ background:#8B5CF6; }
  .dots i:nth-child(2){ background:#E935C1; }
  .dots i:nth-child(3){ background:#5BC8F5; }
</style></head>
<body>
  <div class="photo-wrap">
    <img class="photo" src="brand/ollierdz-nyc-teeth.jpg">
    <div class="fade"></div>
    <div class="fade2"></div>
  </div>
  <div class="glow"></div>

  <div class="safe">
    <div class="stack">
      <div class="title">
        <div class="l1">Today in</div>
        <div class="l2"><span class="box">AI</span></div>
      </div>
      <div class="tag">The latest <b>marketing</b> &amp; <b>AI</b> news</div>
      <div class="foot"><span class="dots"><i></i><i></i><i></i></span> With Ollie Rodriguez</div>
    </div>
  </div>
</body></html>
