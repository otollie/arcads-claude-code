<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="tiktok-base.css">
<style>
  .safe { gap: 40px; }
  .flow { margin-top: 24px; display: flex; flex-direction: column; gap: 0; align-items: center; }
  .panel { width: 100%; border-radius: 24px; padding: 40px 46px; }
  .design { background: #fff; box-shadow: 0 20px 60px rgba(20,20,19,0.12); }
  .plabel { font-family: var(--font-display); font-weight: 600; font-size: 26px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); margin-bottom: 22px;
    display: flex; align-items: center; gap: 14px; }
  .plabel img { width: 34px; }
  .skel { display: flex; gap: 14px; }
  .skel span { display: block; border-radius: 10px; background: #efede5; }
  .arrow { font-family: var(--font-display); font-weight: 600; font-size: 34px; color: var(--muted);
    display: flex; align-items: center; gap: 18px; margin: 26px 0; }
  .arrow .line { font-size: 64px; color: var(--accent); }
  .term { background: #141413; color: #FAF9F5; font-family: 'IBM Plex Mono', monospace; }
  .term .plabel { color: #D97757; }
  .tline { font-size: 30px; line-height: 1.8; font-family: var(--font-display); font-weight: 500; }
  .tline .p { color: #D97757; }
  .tline .ok { color: #788c5d; }
</style></head>
<body>
  <div class="handle">@orod215</div>
  <div class="counter">4/6</div>
  <div class="safe">
    <div class="tag">the move nobody does</div>
    <div class="h">then <span class="a">Claude Code</span><br>builds it</div>
    <div class="sup">one handoff and your design becomes a <b>working page</b>. same day.</div>
    <div class="flow">
      <div class="panel design">
        <div class="plabel"><img src="brand/claude/starburst.png"> your design</div>
        <div class="skel"><span style="width:38%;height:90px"></span><span style="flex:1;height:90px"></span></div>
      </div>
      <div class="arrow"><span class="line">↓</span> hand it off</div>
      <div class="panel term">
        <div class="plabel">claude code</div>
        <div class="tline"><span class="p">›</span> build my landing page from this design</div>
        <div class="tline"><span class="ok">✓</span> deployed. it's live.</div>
      </div>
    </div>
  </div>
  <div class="wm">@orod215</div>
</body></html>
