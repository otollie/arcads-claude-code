<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  @font-face{font-family:'Poppins';src:url('fonts/Poppins-SemiBold.ttf');font-weight:600;}
  @font-face{font-family:'Inter';src:url('fonts/InterVar.ttf');font-weight:100 900;}
  body{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:'Poppins',sans-serif;}
  .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .head{position:absolute;bottom:150px;left:70px;right:70px;z-index:3;font-weight:600;
    font-size:96px;line-height:0.94;color:#14142B;letter-spacing:-1.5px;
    text-shadow:0 2px 24px rgba(255,255,255,0.55);}
  .head .g{color:#4F46E5;}
  .brand{position:absolute;bottom:74px;left:72px;z-index:3;font-weight:600;
    font-size:44px;color:#14142B;letter-spacing:-0.5px;}
  .brand span{color:#4F46E5;}
</style></head>
<body>
  <img class="bg" src="mmg-comp-flat.png">
  <div class="head">One number.<br><span class="g">Every week.</span></div>
  <div class="brand">markmygraph<span>.com</span></div>
</body></html>
