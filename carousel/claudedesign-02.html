<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="tiktok-base.css">
<style>
  .safe { gap: 40px; }
  .mock { position: relative; margin-top: 28px; }
  .doc { width: 560px; height: 380px; background: #fff; border-radius: 20px;
    box-shadow: 0 20px 60px rgba(20,20,19,0.12); padding: 36px; }
  .doc.two { position: absolute; top: 70px; left: 300px; transform: rotate(5deg); }
  .doc .t { height: 34px; width: 70%; background: var(--surface); border-radius: 8px; margin-bottom: 20px; }
  .doc .l { height: 16px; background: #efede5; border-radius: 6px; margin-bottom: 12px; }
  .doc .l.s { width: 62%; }
  .doc .img { height: 150px; background: var(--surface); border-radius: 12px; margin-top: 22px; }
  .badge { position: absolute; top: 320px; left: 60px; transform: rotate(-7deg); z-index: 3;
    font-family: var(--font-display); font-weight: 600; font-size: 46px;
    background: var(--accent); color: #fff; padding: 20px 42px; border-radius: 16px;
    box-shadow: 0 16px 40px rgba(217,119,87,0.4); }
  .h { margin-top: 8px; }
</style></head>
<body>
  <div class="handle">@orod215</div>
  <div class="counter">2/6</div>
  <div class="safe">
    <div class="tag">the myth</div>
    <div class="h">"it's a Canva<br>replacement"</div>
    <div class="sup">yes, it makes decks and one-pagers.<br><b>that's the side quest, not the game.</b></div>
    <div class="mock">
      <div class="doc"><div class="t"></div><div class="l"></div><div class="l s"></div><div class="img"></div></div>
      <div class="doc two"><div class="t"></div><div class="l"></div><div class="l s"></div><div class="img"></div></div>
      <div class="badge">the side quest</div>
    </div>
  </div>
  <div class="wm">@orod215</div>
</body></html>
